[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-vote-ollama"
version = "0.1.0"
description = "Free local majority-vote text classification via Ollama"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.32.3",
  "python-dotenv>=1.0.1",
  "datasets>=2.20.0",
  "pandas>=2.2.2",
  "numpy>=1.26.4",
  "scikit-learn>=1.4.2",
  "tqdm>=4.66.4",
  "tenacity>=8.2.3",
  "matplotlib>=3.8.4"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
